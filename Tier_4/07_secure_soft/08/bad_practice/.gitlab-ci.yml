# .gitlab-ci.yml
# Complete CI/CD pipeline with all stages passing gates.
# Designed for local GitLab-runner with docker-executor.

# Definition of stages (stages) of the pipeline
stages:
  - secret-scan
  - sast
  - test
  - build
  - sca
  - deploy
  - dast

# Using official GitLab templates for scanners
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/DAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

secret_detection:
  allow_failure: false
sast:
  allow_failure: false
unit_test_job:
  allow_failure: false
dependency_scanning:
  allow_failure: false
container_scanning:
  allow_failure: false

# =========================================================================
# STAGE: secret-scan
# =========================================================================
# Scan the repository for secrets.
secret_detection:
  stage: secret-scan
  needs: []

# =========================================================================
# STAGE: sast (Static Application Security Testing)
# =========================================================================
# Static analysis of the code for vulnerabilities.
sast:
  stage: sast
  needs: []

# =========================================================================
# STAGE: test
# =========================================================================
# Running unit tests.
unit_test_job:
  stage: test
  image: python:3.11-slim
  script:
    - echo "Running unit tests..."
    - pip install -r requirements.txt
    - pip install pytest
    - pytest test_app.py
  needs:
    - job: sast
      optional: true

# =========================================================================
# STAGE: build
# =========================================================================
# Creating a Docker image with the application.
docker_build_job:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - echo "Building Docker image..."
    # Authorize in the GitLab container registry using CI variables
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Build the image and tag it for pushing to the registry
    - docker build -t "$CI_REGISTRY_IMAGE" .
    # Push the image to the registry
    - docker push "$CI_REGISTRY_IMAGE"
  needs: ["unit_test_job"]

# =========================================================================
# STAGE: sca (Software Composition Analysis) and sbom
# =========================================================================
# Dependency analysis and SBOM generation.
dependency_scanning:
  stage: sca
  needs: ["docker_build_job"]

container_scanning:
  stage: sca
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE
  needs:
    - docker_build_job
  services:
    - docker:20.10.16-dind

# =========================================================================
# STAGE: deploy
# =========================================================================
# Deploying the application. This stage must come before DAST.
deploy_job:
  stage: deploy
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - echo "Deploying the application..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE"
    - docker run -d --name my-python-app -p 5000:5000 "$CI_REGISTRY_IMAGE"
    - echo "Application deployed locally at http://my-python-app:5000"
    - sleep 10
  needs: ["container_scanning"]

# =========================================================================
# STAGE: dast (Dynamic Application Security Testing)
# =========================================================================
# Dynamic analysis of the running application for vulnerabilities.
dast:
  stage: dast
  variables:
    DAST_WEBSITE: http://my-python-app:5000
  needs: ["deploy_job"]
  services:
    - docker:20.10.16-dind
